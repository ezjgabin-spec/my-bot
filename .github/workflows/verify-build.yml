name: Verify StudyPredict Build
on:
  push:
    branches: [main, diagnostics/typecheck-build]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: TypeScript diagnostics
        run: npm run typecheck
      - name: Cloudflare bundle diagnostics
        run: npm run cloud:build
