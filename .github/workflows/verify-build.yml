name: Verify StudyPredict Build
on:
  push:
    branches: [main, diagnostics/typecheck-build]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: TypeScript diagnostics
        run: npm run typecheck
      - name: Document interpreter and D1 isolation tests
        run: npx vitest run tests/material-interpreter.test.ts tests/cloud-store.test.ts tests/study-links.test.ts tests/pptx-import.test.ts tests/appearance.test.ts tests/writing-teacher-grade.test.ts
      - name: Cloudflare bundle diagnostics
        run: npm run cloud:build

      - name: Dry-run Worker bundle and check current Cloudflare size limit
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler/cloud-bundle
          node scripts/check-worker-size.mjs
      - name: Verified email signup and free-tier runtime tests
        run: node tests/cloud-password-runtime.mjs
