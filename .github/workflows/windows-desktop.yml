name: Windows desktop build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run desktop:win
      - uses: actions/upload-artifact@v4
        with:
          name: StudyPredict-Windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
